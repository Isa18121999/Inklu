<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5">
<title>Restablecer contraseña | INKLU</title>
<style>
:root{--purple:#4f46e5;--ink:#19162d;--muted:#64748b;--line:#e5e0fa;--bg:#f8f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:var(--bg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}main{width:min(100%,470px);padding:28px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 55px #2d235110}.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;font-size:20px;font-weight:900}.mark{width:48px;height:48px;border-radius:15px;background:#ede9ff;display:grid;place-items:center;color:var(--purple);font-size:27px}h1{font-size:26px;line-height:1.2;margin:0 0 10px}p{color:var(--muted);margin:0 0 20px}label{display:block;font-size:14px;font-weight:750;margin:15px 0 6px}input{width:100%;font:inherit;padding:13px 14px;border:1px solid #cbd5e1;border-radius:11px;background:white;color:var(--ink)}input:focus{outline:3px solid #c7d2fe;border-color:var(--purple)}button{width:100%;border:0;border-radius:11px;background:var(--purple);color:#fff;font:inherit;font-weight:800;padding:14px;margin-top:20px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.hint{font-size:12px;line-height:1.45;margin-top:7px}.message{display:none;margin-top:18px;padding:13px;border-radius:11px;background:#f1f5f9;color:#334155;overflow-wrap:anywhere}.message.error{background:#fff1f2;color:#9f1239}a{color:var(--purple);font-weight:700}.foot{margin-top:20px;font-size:12px;text-align:center}
</style></head>
<body><main><div class="brand"><div class="mark" aria-hidden="true">💜</div><span>INKLU</span></div>
<h1>Crear nueva contraseña</h1><p>Elige una contraseña segura para volver a entrar a tu cuenta.</p>
<form id="resetForm">
<label for="password">Nueva contraseña</label><input id="password" type="password" autocomplete="new-password" minlength="8" required>
<div class="hint">Mínimo 8 caracteres e incluye mayúscula, minúscula, número y símbolo.</div>
<label for="confirm">Repite la contraseña</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
<button id="submit" type="submit">Guardar nueva contraseña</button></form>
<div id="message" class="message" role="status" aria-live="polite"></div>
<div class="foot"><a href="https://isa18121999.github.io/Inklu/">Volver a INKLU</a></div></main>
<script>
const API='https://inklu-api.onrender.com/api',params=new URLSearchParams(location.search),token=params.get('token')||'',email=params.get('email')||'',form=document.getElementById('resetForm'),button=document.getElementById('submit'),message=document.getElementById('message');
function showMessage(text,isError=false){message.textContent=text;message.className='message'+(isError?' error':'');message.style.display='block'}
if(!token||!email){form.hidden=true;showMessage('Este enlace no es válido. Solicita un nuevo enlace de recuperación desde la aplicación.',true)}
form.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){showMessage('Las contraseñas no coinciden.',true);return}if(password.length<8||!/[A-Z]/.test(password)||!/[a-z]/.test(password)||!/[0-9]/.test(password)||!/[^A-Za-z0-9]/.test(password)){showMessage('Usa al menos 8 caracteres e incluye mayúscula, minúscula, número y símbolo.',true);return}button.disabled=true;button.textContent='Actualizando...';message.style.display='none';try{const response=await fetch(API+'/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,token,password})}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'No se pudo cambiar la contraseña.');form.hidden=true;showMessage(data.message||'Tu contraseña fue actualizada. Ya puedes iniciar sesión en INKLU.')}catch(error){showMessage(error.message||'No se pudo conectar. Inténtalo nuevamente.',true);button.disabled=false;button.textContent='Guardar nueva contraseña'}});
</script></body></html>
