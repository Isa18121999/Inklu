name: Publish INKLU authentication pages

on:
  push:
    branches: [main]
    paths:
      - 'reset-password.html'
      - 'verify-email.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare authentication-only site
        run: |
          mkdir -p site
          cp reset-password.html verify-email.html site/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>INKLU</title>
          <body>
            <main>
              <h1>INKLU</h1>
              <p>INKLU es una aplicación móvil. Esta dirección aloja únicamente las páginas auxiliares para verificar el correo y restablecer la contraseña.</p>
            </main>
          </body>
          </html>
          EOF

      - name: Upload authentication pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
