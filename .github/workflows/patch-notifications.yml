name: Patch notifications screen

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Conectar notificaciones a pantalla completa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch main.dart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('flutter_app/lib/main.dart')
          s = p.read_text()
          if "import 'notifications_page.dart';" not in s:
              s = s.replace("import 'create_offer_page.dart';", "import 'create_offer_page.dart';\nimport 'notifications_page.dart';")
          start = s.index('Future<void> showNotifications(BuildContext context) async {')
          end = s.index('\nFuture<void> deleteAccountFlow', start)
          replacement = '''Future<void> showNotifications(BuildContext context) async {
  final token = sessionToken;
  if (token == null || token.isEmpty) {
    toast('Inicia sesión para consultar tus notificaciones.');
    return;
  }
  await Navigator.push<void>(
    context,
    MaterialPageRoute(
      builder: (_) => NotificationsPage(token: token, api: api),
    ),
  );
}
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_app/lib/main.dart .github/workflows/patch-notifications.yml
          git commit -m 'Conectar notificaciones a pantalla completa'
          git push
