name: Patch notifications page

on:
  push:
    paths:
      - '.github/workflows/patch-notifications.yml'
      - '.github/workflows/trigger-notifications.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch main.dart
        run: |
          python3 -c 'from pathlib import Path; p=Path("flutter_app/lib/main.dart"); s=p.read_text(encoding="utf-8"); s=s.replace("import '\''create_offer_page.dart'\'';", "import '\''create_offer_page.dart'\'';\nimport '\''notifications_page.dart'\'';", 1) if "import '\''notifications_page.dart'\'';" not in s else s; start=s.index("Future<void> showNotifications(BuildContext context) async {"); end=s.index("\nFuture<void> deleteAccountFlow", start); replacement="""Future<void> showNotifications(BuildContext context) async {\n  final token = sessionToken;\n  if (token == null || token.isEmpty) {\n    toast('Inicia sesión para consultar tus notificaciones.');\n    return;\n  }\n  await Navigator.push<void>(\n    context,\n    MaterialPageRoute(\n      builder: (_) => NotificationsPage(token: token, api: api),\n    ),\n  );\n}\n"""; p.write_text(s[:start]+replacement+s[end:], encoding="utf-8")'

      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart
          git rm -f .github/workflows/patch-notifications.yml .github/workflows/trigger-notifications.txt || true
          git diff --cached --quiet || git commit -m "Conectar notificaciones a pantalla completa"
          git push
