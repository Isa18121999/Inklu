name: Patch notifications page

on:
  push:
    paths:
      - '.github/workflows/patch-notifications.yml'
      - '.github/workflows/trigger-notifications.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch main.dart
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("flutter_app/lib/main.dart")
          s = p.read_text(encoding="utf-8")

          if "import 'notifications_page.dart';" not in s:
              marker = "import 'create_offer_page.dart';"
              if marker not in s:
                  raise SystemExit("No se encontró el import de create_offer_page.dart")
              s = s.replace(marker, marker + "\nimport 'notifications_page.dart';", 1)

          start_marker = "Future<void> showNotifications(BuildContext context) async {"
          end_marker = "\nFuture<void> deleteAccountFlow"
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit("No se encontró showNotifications")
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit("No se encontró el final de showNotifications")

          replacement = '''Future<void> showNotifications(BuildContext context) async {
            final token = sessionToken;
            if (token == null || token.isEmpty) {
              toast('Inicia sesión para consultar tus notificaciones.');
              return;
            }
            await Navigator.push<void>(
              context,
              MaterialPageRoute(
                builder: (_) => NotificationsPage(token: token, api: api),
              ),
            );
          }
          '''

          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding="utf-8")
          print("main.dart actualizado correctamente")
          PY

      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart
          git rm -f .github/workflows/patch-notifications.yml .github/workflows/trigger-notifications.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Conectar notificaciones a pantalla completa"
            git push
          fi
