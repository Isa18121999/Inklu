name: Patch notifications page

on:
  push:
    paths:
      - '.github/workflows/patch-notifications.yml'
      - '.github/workflows/trigger-notifications.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace notifications dialog with full-screen page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('flutter_app/lib/main.dart')
          s = p.read_text(encoding='utf-8')

          if "import 'notifications_page.dart';" not in s:
              s = s.replace("import 'create_offer_page.dart';", "import 'create_offer_page.dart';\nimport 'notifications_page.dart';", 1)

          start = s.index('Future<void> showNotifications(BuildContext context) async {')
          end = s.index('\nFuture<void> deleteAccountFlow', start)
          replacement = '''Future<void> showNotifications(BuildContext context) async {
  final token = sessionToken;
  if (token == null || token.isEmpty) {
    toast('Inicia sesión para consultar tus notificaciones.');
    return;
  }
  await Navigator.push<void>(
    context,
    MaterialPageRoute(
      builder: (_) => NotificationsPage(token: token, api: api),
    ),
  );
}
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart
          git rm -f .github/workflows/patch-notifications.yml .github/workflows/trigger-notifications.txt || true
          git diff --cached --quiet || git commit -m "Conectar notificaciones a pantalla completa"
          git push
