name: Build INKLU Android APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - 'assets/logo.png'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Generate Android platform and apply INKLU branding
        run: |
          set -euo pipefail
          flutter create --platforms=android .
          mkdir -p assets
          cp ../assets/logo.png assets/logo.png
          python3 -m pip install --user --break-system-packages Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          source = Image.open("assets/logo.png").convert("RGBA")
          res = Path("android/app/src/main/res")
          densities = {
              "mipmap-mdpi": (48, 108),
              "mipmap-hdpi": (72, 162),
              "mipmap-xhdpi": (96, 216),
              "mipmap-xxhdpi": (144, 324),
              "mipmap-xxxhdpi": (192, 432),
          }
          for folder, (icon_size, foreground_size) in densities.items():
              out = res / folder
              out.mkdir(parents=True, exist_ok=True)

              # Legacy launcher icon for Android versions below 8.
              legacy = Image.new("RGBA", (icon_size, icon_size), (255, 255, 255, 255))
              mark = ImageOps.contain(source, (int(icon_size * .78), int(icon_size * .78)), Image.Resampling.LANCZOS)
              legacy.alpha_composite(mark, ((icon_size-mark.width)//2, (icon_size-mark.height)//2))
              legacy.save(out / "ic_launcher.png")

              # Transparent foreground layer for adaptive launcher icons.
              foreground = Image.new("RGBA", (foreground_size, foreground_size), (0, 0, 0, 0))
              mark = ImageOps.contain(source, (int(foreground_size * .66), int(foreground_size * .66)), Image.Resampling.LANCZOS)
              foreground.alpha_composite(mark, ((foreground_size-mark.width)//2, (foreground_size-mark.height)//2))
              foreground.save(out / "ic_launcher_foreground.png")

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources><color name="ic_launcher_background">#FFFFFF</color></resources>',
              encoding="utf-8")
          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / "ic_launcher.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@color/ic_launcher_background"/>'
              '<foreground android:drawable="@mipmap/ic_launcher_foreground"/>'
              '</adaptive-icon>', encoding="utf-8")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android:icon=' not in s:
              s = s.replace('<application', '<application android:icon="@mipmap/ic_launcher"', 1)
              p.write_text(s)
          PY
          sed -i 's/android:label="[^"]*"/android:label="INKLU"/' android/app/src/main/AndroidManifest.xml

      - name: Ensure Android Internet permission
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if permission not in content:
              marker = "<application"
              position = content.find(marker)
              if position < 0:
                  raise SystemExit("No se encontró la etiqueta <application> en AndroidManifest.xml")
              content = content[:position] + permission + chr(10) + "    " + content[position:]
              manifest.write_text(content, encoding="utf-8")

          if permission not in manifest.read_text(encoding="utf-8"):
              raise SystemExit("Falta android.permission.INTERNET en AndroidManifest.xml")
          print("OK: android.permission.INTERNET está declarado.")
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/inklu-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/inklu-upload.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if 'create("release")' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + s
              marker = 'android {'
              config = '''android {
              signingConfigs {
                  create("release") {
                      val props = Properties()
                      val propsFile = rootProject.file("key.properties")
                      props.load(FileInputStream(propsFile))
                      keyAlias = props["keyAlias"] as String
                      keyPassword = props["keyPassword"] as String
                      storeFile = rootProject.file(props["storeFile"] as String)
                      storePassword = props["storePassword"] as String
                  }
              }
          '''
              s = s.replace(marker, config, 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("release")')
              p.write_text(s)
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/inklu-upload.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
