name: Build INKLU Android APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - 'assets/logo.png'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Generate Android platform and apply INKLU branding
        run: |
          set -euo pipefail
          flutter create --platforms=android .
          mkdir -p assets
          cp ../assets/logo.png assets/logo.png
          python3 -m pip install --user --break-system-packages Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          source = Image.open("assets/logo.png").convert("RGBA")
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96,
                   "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, size in sizes.items():
              out = Path("android/app/src/main/res") / folder
              out.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), (255, 255, 255, 255))
              icon = ImageOps.contain(source, (int(size * .78), int(size * .78)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(icon, ((size-icon.width)//2, (size-icon.height)//2))
              canvas.save(out / "ic_launcher.png")
          adaptive = Path("android/app/src/main/res/mipmap-anydpi-v26")
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / "ic_launcher.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@android:color/white"/>'
              '<foreground android:drawable="@mipmap/ic_launcher"/>'
              '</adaptive-icon>', encoding="utf-8")
          PY
          sed -i 's/android:label="[^"]*"/android:label="INKLU"/' android/app/src/main/AndroidManifest.xml

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/inklu-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/inklu-upload.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if 'create("release")' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + s
              marker = 'android {'
              config = '''android {
              signingConfigs {
                  create("release") {
                      val props = Properties()
                      val propsFile = rootProject.file("key.properties")
                      props.load(FileInputStream(propsFile))
                      keyAlias = props["keyAlias"] as String
                      keyPassword = props["keyPassword"] as String
                      storeFile = rootProject.file(props["storeFile"] as String)
                      storePassword = props["storePassword"] as String
                  }
              }
          '''
              s = s.replace(marker, config, 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("release")')
              p.write_text(s)
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/inklu-upload.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
