name: Fix Flutter accessibility announce

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-semantic-announce.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore main.dart from last known good revision
        run: |
          git checkout c96e856d783941484edd7b77bba04478574409ad -- flutter_app/lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('flutter_app/lib/main.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  SemanticsService.announce(s, TextDirection.ltr);\n", "")
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_app/lib/main.dart
          git commit -m 'Restaurar main.dart y corregir accesibilidad' || exit 0
          git push
