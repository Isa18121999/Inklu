name: Fix Flutter accessibility announce

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-semantic-announce.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore main.dart from last good revision and fix announce
        run: |
          git checkout aa9eaa3d0435657b7c5de9bf8fa8d9a00c7d8714 -- flutter_app/lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('flutter_app/lib/main.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace('SemanticsService.announce(s, TextDirection.ltr);', 'SemanticsService.sendAnnouncement(TextDirection.ltr, s);')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_app/lib/main.dart
          git commit -m 'Restaurar main.dart y corregir announce' || exit 0
          git push
