name: Validate accessibility priorities

on:
  push:
    branches: [feature/inklu-accessibility-priorities]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/inklu-accessibility-priorities
          fetch-depth: 1
      - name: Validate backend JavaScript
        run: |
          node --check backend/server.js
          node --check backend/models/User.js
          node --check backend/models/Job.js
          node --check backend/models/Report.js
      - name: Validate Flutter source formatting
        working-directory: flutter_app
        run: |
          if command -v flutter >/dev/null 2>&1; then
            dart format --output=none --set-exit-if-changed lib/main.dart lib/services/api_service.dart lib/services/accessibility_page.dart
          else
            echo 'Flutter SDK unavailable on runner; JavaScript validation completed.'
          fi
