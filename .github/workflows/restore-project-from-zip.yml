name: Restore INKLU source from ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract original project
        shell: bash
        run: |
          set -euo pipefail
          test -f Inklu-main.zip
          mkdir -p /tmp/inklu-source
          unzip -q Inklu-main.zip -d /tmp/inklu-source
          test -d /tmp/inklu-source/Inklu-main
          cp -a /tmp/inklu-source/Inklu-main/. .
          rm -f Inklu-main.zip
          test -f flutter_app/pubspec.yaml
          test -f flutter_app/lib/main.dart
          test -f backend/server.js

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Restore complete INKLU source project from ZIP"
          git push
