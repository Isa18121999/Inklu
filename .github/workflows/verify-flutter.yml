name: INKLU Flutter verification

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - 'assets/logo.png'
      - '.github/workflows/verify-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inklu-flutter-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-android:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Prepare Android platform and branding
        working-directory: flutter_app
        run: |
          set -euo pipefail
          flutter create --platforms=android .
          mkdir -p assets android/app/src/main/res/drawable
          cp ../assets/logo.png assets/logo.png
          cp assets/logo.png android/app/src/main/res/drawable/inklu_icon.png
          sed -i 's#@mipmap/ic_launcher_round#@drawable/inklu_icon#g; s#@mipmap/ic_launcher#@drawable/inklu_icon#g; s/android:label="inklu"/android:label="INKLU"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Static analysis
        working-directory: flutter_app
        run: flutter analyze --no-pub

      - name: Automated tests
        working-directory: flutter_app
        run: flutter test --reporter expanded

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release
