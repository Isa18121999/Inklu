name: Apply accessibility form patch

on:
  push:
    branches: [feature/accessibility-form]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Flutter company form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('flutter_app/lib/main.dart')
          s = p.read_text()

          old = "    final accessibilityDetails = TextEditingController();"
          new = """    final accessibilityDetails = TextEditingController();
    bool workplaceAdaptation = false;
    bool assistiveTechnology = false;
    bool flexibleSchedule = false;
    bool physicalAccess = false;
    bool accessibleRestroom = false;
    bool elevator = false;
    bool accessibleParking = false;"""
          if old not in s:
              raise SystemExit('controllers marker not found')
          s = s.replace(old, new, 1)

          old = "                F(accessibilityDetails, 'Accesibilidad y ajustes disponibles', max: 4),"
          new = """                F(accessibilityDetails, 'Información adicional de accesibilidad (opcional)', max: 4),
                const SizedBox(height: 8),
                const Text('Medidas de accesibilidad disponibles', style: TextStyle(fontWeight: FontWeight.w800, color: ink)),
                const SizedBox(height: 4),
                CheckboxListTile(
                  value: workplaceAdaptation,
                  onChanged: (v) => setState(() => workplaceAdaptation = v ?? false),
                  title: const Text('Adaptaciones del puesto'),
                  dense: true,
                  contentPadding: EdgeInsets.zero,
                  controlAffinity: ListTileControlAffinity.leading,
                ),
                CheckboxListTile(
                  value: assistiveTechnology,
                  onChanged: (v) => setState(() => assistiveTechnology = v ?? false),
                  title: const Text('💻 Tecnología asistiva'),
                  dense: true,
                  contentPadding: EdgeInsets.zero,
                  controlAffinity: ListTileControlAffinity.leading,
                ),
                CheckboxListTile(
                  value: flexibleSchedule,
                  onChanged: (v) => setState(() => flexibleSchedule = v ?? false),
                  title: const Text('🕐 Horario flexible'),
                  dense: true,
                  contentPadding: EdgeInsets.zero,
                  controlAffinity: ListTileControlAffinity.leading,
                ),
                CheckboxListTile(
                  value: physicalAccess,
                  onChanged: (v) => setState(() => physicalAccess = v ?? false),
                  title: const Text('♿ Acceso físico'),
                  dense: true,
                  contentPadding: EdgeInsets.zero,
                  controlAffinity: ListTileControlAffinity.leading,
                ),
                CheckboxListTile(
                  value: accessibleRestroom,
                  onChanged: (v) => setState(() => accessibleRestroom = v ?? false),
                  title: const Text('🚻 Baño accesible'),
                  dense: true,
                  contentPadding: EdgeInsets.zero,
                  controlAffinity: ListTileControlAffinity.leading,
                ),
                CheckboxListTile(
                  value: elevator,
                  onChanged: (v) => setState(() => elevator = v ?? false),
                  title: const Text('🛗 Ascensor'),
                  dense: true,
                  contentPadding: EdgeInsets.zero,
                  controlAffinity: ListTileControlAffinity.leading,
                ),
                CheckboxListTile(
                  value: accessibleParking,
                  onChanged: (v) => setState(() => accessibleParking = v ?? false),
                  title: const Text('🅿️ Estacionamiento accesible'),
                  dense: true,
                  contentPadding: EdgeInsets.zero,
                  controlAffinity: ListTileControlAffinity.leading,
                ),"""
          if old not in s:
              raise SystemExit('form marker not found')
          s = s.replace(old, new, 1)

          old = """          'accessibility': {
            'remote': modality.toLowerCase().contains('remoto'),
            'hybrid': modality.toLowerCase().contains('híbrido') || modality.toLowerCase().contains('hibrido'),
            'notes': accessibilityDetails.text.trim(),
          },"""
          new = """          'accessibility': {
            'remote': modality.toLowerCase().contains('remoto'),
            'hybrid': modality.toLowerCase().contains('híbrido') || modality.toLowerCase().contains('hibrido'),
            'physicalAccess': physicalAccess,
            'flexibleSchedule': flexibleSchedule,
            'workplaceAdaptation': workplaceAdaptation,
            'assistiveTechnology': assistiveTechnology,
            'accessibleRestroom': accessibleRestroom,
            'elevator': elevator,
            'accessibleParking': accessibleParking,
            'notes': accessibilityDetails.text.trim(),
          },"""
          if old not in s:
              raise SystemExit('payload marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove patch workflow and commit changes
        run: |
          rm -f .github/workflows/accessibility-form-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart .github/workflows/accessibility-form-patch.yml
          git commit -m "feat: add accessibility checklist to company job form"
          git push
