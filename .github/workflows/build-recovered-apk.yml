name: Build recovered INKLU APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-recovered-apk.yml'
      - 'flutter_app/**'
      - 'assets/logo.png'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable

      - name: Prepare official INKLU logo
        working-directory: flutter_app
        run: |
          set -e
          test -f ../assets/logo.png
          mkdir -p assets
          cp ../assets/logo.png assets/logo.png
          python3 - <<'PY'
          import base64
          from pathlib import Path
          png = Path('assets/logo.png').read_bytes()
          if not png.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('assets/logo.png is not a valid PNG')
          Path('assets/logo.b64').write_text(base64.b64encode(png).decode('ascii'), encoding='ascii')
          print(f'Canonical logo Base64 generated: {len(png)} bytes')
          PY

      - name: Make Logo widget use official PNG
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          text = p.read_text(encoding='utf-8')
          old = "class _LogoState extends State<Logo>{Uint8List? b;@override void initState(){super.initState();rootBundle.loadString('assets/logo.b64').then((x){if(mounted)setState(()=>b=base64Decode(x.trim()));});}@override Widget build(BuildContext c)=>b==null?SizedBox(width:widget.size,height:widget.size):Semantics(label:'Logo INKLU',image:true,child:Image.memory(b!,width:widget.size,height:widget.size,fit:BoxFit.contain));}"
          new = "class _LogoState extends State<Logo>{@override Widget build(BuildContext c)=>Semantics(label:'Logo INKLU',image:true,child:Image.asset('assets/logo.png',width:widget.size,height:widget.size,fit:BoxFit.contain));}"
          if old not in text:
              raise SystemExit('Expected Logo widget source was not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Logo widget switched to official PNG asset')
          PY

      - name: Ensure application status filter helper
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          text = p.read_text(encoding='utf-8')
          if 'bool applicationStatusMatchesFilter(' in text:
              print('Application status filter helper already present')
              raise SystemExit(0)
          marker = 'class CandidateHome extends StatefulWidget'
          if marker not in text:
              raise SystemExit('CandidateHome marker not found')
          helper = '''bool applicationStatusMatchesFilter(String? rawStatus, String selectedFilter) {
            final filter = normalizeApplicationStatus(selectedFilter).trim().toLowerCase();
            final status = normalizeApplicationStatus(rawStatus).trim().toLowerCase();
            if (filter.isEmpty || filter == 'todas') return true;
            if (filter == 'retirada') return status.contains('retirada');
            if (filter == 'postulado') return status == 'postulado' || status == 'postulada';
            if (filter == 'cv visto') return status.contains('cv visto');
            if (filter == 'en proceso') return status.contains('en proceso');
            return status == filter;
          }

          '''
          p.write_text(text.replace(marker, helper + marker, 1), encoding='utf-8')
          print('Application status filter helper inserted')
          PY

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Test
        working-directory: flutter_app
        run: flutter test

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-Android-actualizado
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
