name: Build INKLU Android APK

run-name: INKLU APK build ${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-apk-now.yml'
      - '.github/workflows/pages.yml'
      - 'flutter_app/lib/**'
      - 'flutter_app/pubspec.yaml'
      - 'assets/logo.png'

permissions:
  contents: write

concurrency:
  group: inklu-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest INKLU
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: flutter_app
        run: flutter create --platforms=android .

      - name: Prepare INKLU branding and network permission
        working-directory: flutter_app
        run: |
          set -euo pipefail
          mkdir -p assets android/app/src/main/res/drawable
          cp ../assets/logo.png assets/logo.png
          python3 -c "import base64; from pathlib import Path; p=Path('assets/logo.png'); Path('assets/logo.b64').write_text(base64.b64encode(p.read_bytes()).decode('ascii'))"
          cp assets/logo.png android/app/src/main/res/drawable/inklu_icon.png
          sed -i 's#@mipmap/ic_launcher_round#@drawable/inklu_icon#g; s#@mipmap/ic_launcher#@drawable/inklu_icon#g; s/android:label="inklu"/android:label="INKLU"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test --reporter expanded

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Publish APK as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            flutter_app/build/app/outputs/flutter-apk/app-release.apk#INKLU-Android.apk \
            --title "INKLU Android APK - build ${GITHUB_RUN_NUMBER}" \
            --notes "APK de prueba generado desde main. Build ${GITHUB_RUN_NUMBER}." \
            --prerelease
