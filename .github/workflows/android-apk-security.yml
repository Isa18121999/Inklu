name: Build INKLU APK with Security Report

run-name: INKLU security APK ${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inklu-apk-security-report
  cancel-in-progress: false

jobs:
  build-android:
    name: Build, inspect and sign INKLU APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing signing secret: $name"; exit 1; fi
          done
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Generate Android project files
        working-directory: flutter_app
        run: flutter create --platforms=android .
      - name: Apply INKLU branding
        working-directory: flutter_app
        run: |
          set -euo pipefail
          mkdir -p assets android/app/src/main/res/drawable
          cp ../assets/logo.png assets/logo.png
          base64 -w 0 assets/logo.png > assets/logo.b64
          cp assets/logo.png android/app/src/main/res/drawable/inklu_icon.png
          sed -i 's#@mipmap/ic_launcher_round#@drawable/inklu_icon#g; s#@mipmap/ic_launcher#@drawable/inklu_icon#g; s/android:label="inklu"/android:label="INKLU"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml; fi
      - name: Configure release signing
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/inklu-upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/inklu-upload-key.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re

          nl = chr(10)
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # Repair any escaped line breaks left by earlier workflow attempts.
          s = s.replace(chr(92) + "n", nl)

          if "import java.util.Properties" not in s:
              s = "import java.util.Properties" + nl + s

          if "val keystoreProperties = Properties()" not in s:
              match = re.search("plugins\\s*\\{.*?\\}", s, flags=re.S)
              if not match:
                  raise SystemExit("Could not locate plugins block")
              props = nl.join([
                  "val keystoreProperties = Properties()",
                  'val keystorePropertiesFile = rootProject.file("key.properties")',
                  "if (keystorePropertiesFile.exists()) {",
                  "    keystoreProperties.load(keystorePropertiesFile.inputStream())",
                  "}",
                  "",
                  ""
              ])
              s = s[:match.end()] + nl + nl + props + s[match.end():]

          if 'create("release")' not in s:
              signing = nl.join([
                  "    signingConfigs {",
                  '        create("release") {',
                  '            keyAlias = keystoreProperties["keyAlias"] as String',
                  '            keyPassword = keystoreProperties["keyPassword"] as String',
                  '            storeFile = rootProject.file(keystoreProperties["storeFile"] as String)',
                  '            storePassword = keystoreProperties["storePassword"] as String',
                  "        }",
                  "    }",
                  "",
                  ""
              ])
              if "    buildTypes {" not in s:
                  raise SystemExit("Could not locate buildTypes block")
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              raise SystemExit("Release signing is not attached")
          p.write_text(s)

          if chr(92) + "n" in p.read_text():
              raise SystemExit("Literal backslash-n remains in Gradle file")
          PY
      - name: Resolve Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: flutter_app
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test --reporter expanded
      - name: Build obfuscated release APK
        working-directory: flutter_app
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols
      - name: Verify APK signature and create diagnostics
        working-directory: flutter_app
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature-verification.txt
          {
            echo "INKLU APK SECURITY DIAGNOSTICS"
            echo "Build: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "UTC date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "APK SHA-256:"
            sha256sum "$APK"
            echo
            echo "APK size:"
            du -h "$APK"
            echo
            echo "SIGNATURE AND CERTIFICATE:"
            cat apk-signature-verification.txt
            echo
            echo "PACKAGE AND SDK INFORMATION:"
            "$AAPT" dump badging "$APK" | head -n 40
            echo
            echo "DECLARED PERMISSIONS:"
            "$AAPT" dump permissions "$APK"
          } > inklu-apk-diagnostics.txt
          cat inklu-apk-diagnostics.txt
      - name: Upload APK and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: inklu-apk-security-${{ github.run_number }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/inklu-apk-diagnostics.txt
            flutter_app/apk-signature-verification.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-security-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \\
            flutter_app/build/app/outputs/flutter-apk/app-release.apk#INKLU-Android-Signed.apk \\
            flutter_app/inklu-apk-diagnostics.txt#INKLU-Security-Diagnostics.txt \\
            --title "INKLU APK Security Build ${GITHUB_RUN_NUMBER}" \\
            --notes "APK firmado con reporte de certificado, SHA-256, package info y permisos. Este reporte no equivale a certificación Huawei ni a análisis antivirus externo." \\
            --prerelease
