name: Apply structured accessibility filter fix
on:
  workflow_dispatch:
  push:
    branches: [feature/inklu-accessibility-priorities]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inklu-accessibility-priorities
          fetch-depth: 1
      - run: python3 tool/fix_server_accessibility_filter.py
      - run: node --check backend/server.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js
          git commit -m 'feat: filter jobs by structured accessibility' || exit 0
          git push origin feature/inklu-accessibility-priorities
