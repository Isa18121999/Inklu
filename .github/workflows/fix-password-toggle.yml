name: Fix password toggle placement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix misplaced password toggle
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('flutter_app/lib/main.dart')
          text = path.read_text(encoding='utf-8')

          candidate = text.index('class CandidateRegister extends StatefulWidget')
          login = text.index('class Login extends StatefulWidget')
          candidate_block = text[candidate:login]

          bad = re.compile(r"\s*TextField\(\s*controller: p,\s*obscureText: !_showPassword,.*?\n\s*\),\n\s*const Text\(\n", re.S)
          if bad.search(candidate_block):
              fixed_candidate = bad.sub("\n              F(p, 'Contraseña', obscure: true),\n              const Text(\n", candidate_block, count=1)
              text = text[:candidate] + fixed_candidate + text[login:]

          login_start = text.index('class _LoginState extends State<Login>')
          login_end = text.index('class CandidateHome extends StatefulWidget')
          login_block = text[login_start:login_end]

          if 'bool _showPassword = false;' not in login_block:
              login_block = login_block.replace('  bool rememberSession = false;\n', '  bool rememberSession = false;\n  bool _showPassword = false;\n', 1)

          if "F(p, 'Contraseña', obscure: true)," in login_block:
              login_block = login_block.replace(
                  "            F(p, 'Contraseña', obscure: true),",
                  """            TextField(
              controller: p,
              obscureText: !_showPassword,
              enabled: !busy,
              decoration: InputDecoration(
                labelText: 'Contraseña',
                prefixIcon: const Icon(Icons.lock_outline),
                suffixIcon: IconButton(
                  tooltip: _showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña',
                  onPressed: busy ? null : () => setState(() => _showPassword = !_showPassword),
                  icon: Icon(
                    _showPassword ? Icons.visibility_off_outlined : Icons.visibility_outlined,
                  ),
                ),
              ),
            ),""", 1)

          text = text[:login_start] + login_block + text[login_end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_app/lib/main.dart
          git commit -m 'Fix password visibility toggle placement'
          git push
