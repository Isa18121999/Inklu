name: Fix password toggle placement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize password visibility state
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('flutter_app/lib/main.dart')
          text = path.read_text(encoding='utf-8')

          # Remove every misplaced declaration first.
          text = re.sub(r'\n\s*bool _showPassword = false;\s*', '\n', text)

          # Make sure the login state owns the field.
          login_start = text.index('class _LoginState extends State<Login>')
          login_end = text.index('class CandidateHome extends StatefulWidget', login_start)
          login_block = text[login_start:login_end]

          marker = '  bool rememberSession = false;'
          if marker not in login_block:
              raise SystemExit('Login state marker not found')
          login_block = login_block.replace(
              marker,
              marker + '\n  bool _showPassword = false;',
              1,
          )

          # The candidate registration password must remain a normal field.
          candidate_start = text.index('class CandidateRegister extends StatefulWidget')
          candidate_block = text[candidate_start:login_start]
          candidate_block = re.sub(
              r'TextField\(\s*controller:\s*p,\s*obscureText:\s*!_showPassword,.*?\n\s*\),',
              "F(p, 'Contraseña', obscure: true),",
              candidate_block,
              count=1,
              flags=re.S,
          )

          # Rebuild the source using the corrected blocks.
          text = text[:candidate_start] + candidate_block + text[login_start:]
          login_start = text.index('class _LoginState extends State<Login>')
          login_end = text.index('class CandidateHome extends StatefulWidget', login_start)
          text = text[:login_start] + login_block + text[login_end:]

          path.write_text(text, encoding='utf-8')

      - name: Verify source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('flutter_app/lib/main.dart').read_text(encoding='utf-8')
          assert text.count('bool _showPassword = false;') == 1
          login_start = text.index('class _LoginState extends State<Login>')
          login_end = text.index('class CandidateHome extends StatefulWidget', login_start)
          login = text[login_start:login_end]
          assert 'bool _showPassword = false;' in login
          assert 'obscureText: !_showPassword' in login
          print('Password toggle state is declared exactly once inside _LoginState.')
          PY

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_app/lib/main.dart
          git commit -m 'Fix password visibility toggle state scope'
          git push
