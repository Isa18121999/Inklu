name: Build INKLU Secure APK

run-name: INKLU signed APK ${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inklu-secure-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    name: Build signed and obfuscated Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Add all four signing secrets before running this workflow."
              exit 1
            fi
          done

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: flutter_app
        run: flutter create --platforms=android .

      - name: Install INKLU branding and internet permission
        working-directory: flutter_app
        run: |
          set -euo pipefail
          mkdir -p assets android/app/src/main/res/drawable
          cp ../assets/logo.png assets/logo.png
          base64 -w 0 assets/logo.png > assets/logo.b64
          cp assets/logo.png android/app/src/main/res/drawable/inklu_icon.png
          sed -i 's#@mipmap/ic_launcher_round#@drawable/inklu_icon#g; s#@mipmap/ic_launcher#@drawable/inklu_icon#g; s/android:label="inklu"/android:label="INKLU"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi

      - name: Configure private Android release signing
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/inklu-upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/inklu-upload-key.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Expected generated Kotlin Gradle file android/app/build.gradle.kts was not found.")
          s = p.read_text()
          if "keystorePropertiesFile" not in s:
              s = "import java.util.Properties\n\n" + s
              marker = "android {"
              if marker not in s:
                  raise SystemExit("Could not find android block in Gradle file.")
              s = s.replace(
                  marker,
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) { keystoreProperties.load(keystorePropertiesFile.inputStream()) }\n\n'
                  + marker,
                  1
              )
          if 'create("release")' not in s:
              marker = "    buildTypes {"
              if marker not in s:
                  raise SystemExit("Could not find buildTypes block in Gradle file.")
              signing = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                  '            storeFile = rootProject.file(keystoreProperties["storeFile"] as String)\n'
                  '            storePassword = keystoreProperties["storePassword"] as String\n'
                  '        }\n'
                  '    }\n\n'
              )
              s = s.replace(marker, signing + marker, 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              raise SystemExit("Release signing was not attached to the release build type.")
          p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: flutter_app
        run: flutter analyze --no-pub

      - name: Run widget tests
        working-directory: flutter_app
        run: flutter test --reporter expanded

      - name: Build obfuscated signed release APK
        working-directory: flutter_app
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Verify APK signature
        working-directory: flutter_app
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Publish signed APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-secure-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            flutter_app/build/app/outputs/flutter-apk/app-release.apk#INKLU-Android-Signed.apk \
            --title "INKLU Android Signed APK - build ${GITHUB_RUN_NUMBER}" \
            --notes "APK firmado y verificado. Build ${GITHUB_RUN_NUMBER}." \
            --prerelease
