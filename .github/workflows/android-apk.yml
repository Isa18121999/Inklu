name: Build INKLU APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: flutter_app
        run: flutter create --platforms=android .

      - name: Install INKLU branding, launcher icon and internet permission
        working-directory: flutter_app
        run: |
          mkdir -p assets android/app/src/main/res/drawable
          cp ../assets/logo.png assets/logo.png
          base64 -w 0 assets/logo.png > assets/logo.b64
          cp assets/logo.png android/app/src/main/res/drawable/inklu_icon.png
          sed -i 's#@mipmap/ic_launcher_round#@drawable/inklu_icon#g; s#@mipmap/ic_launcher#@drawable/inklu_icon#g; s/android:label="inklu"/android:label="INKLU"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: flutter_app
        run: |
          flutter analyze > analyze.txt 2>&1 || true
          cat analyze.txt

      - name: Upload analyzer report
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-analyze-latest
          path: flutter_app/analyze.txt
          if-no-files-found: error

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-Android
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
