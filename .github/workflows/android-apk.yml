name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci

      - name: Align native dependencies with Expo SDK
        working-directory: mobile
        run: npx expo install --fix

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build self-contained release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest mobile/android/app/build/outputs/apk/debug/app-debug.apk             --title "Inklu APK"             --notes "APK generado automáticamente desde main. Backend permanece sin cambios."             --target "${{ github.sha }}"             --latest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inklu-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # APK build pipeline intentionally kept independent from the backend.
