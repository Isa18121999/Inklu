name: Apply final accessibility UI patch
on:
  push:
    branches: [feature/inklu-accessibility-priorities]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inklu-accessibility-priorities
          fetch-depth: 1
      - run: python3 tool/final_accessibility_ui_patch.py
      - run: node --check backend/server.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js flutter_app/lib/main.dart
          git commit -m 'feat: expose accessibility and verification in offers' || exit 0
          git push origin feature/inklu-accessibility-priorities
