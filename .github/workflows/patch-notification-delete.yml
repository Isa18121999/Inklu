name: Patch notification delete API

on:
  push:
    paths:
      - '.github/workflows/patch-notification-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch backend notification routes
        shell: python
        run: |
          from pathlib import Path
          path = Path('backend/server.js')
          text = path.read_text(encoding='utf-8')
          marker = "app.patch('/api/notifications/:id/read', auth, async (req, res) => {"
          if marker not in text:
              raise SystemExit('No se encontró la ruta de lectura de notificaciones.')

          route = '''

app.delete('/api/notifications/:id', auth, async (req, res) => {
  try {
    if (!mongoose.isValidObjectId(req.params.id)) {
      return res.status(400).json({ message: 'Notificación no válida.' });
    }
    const deleted = await Notification.findOneAndDelete({
      _id: req.params.id,
      userId: req.user._id
    });
    if (!deleted) return res.status(404).json({ message: 'Notificación no encontrada.' });
    return res.json({ message: 'Notificación eliminada.', id: String(deleted._id) });
  } catch (e) {
    console.error('No se pudo eliminar la notificación:', e);
    return res.status(500).json({ message: 'No se pudo eliminar la notificación.' });
  }
});

app.delete('/api/notifications', auth, async (req, res) => {
  try {
    const ids = Array.isArray(req.body?.ids)
      ? req.body.ids.map(id => String(id)).filter(id => mongoose.isValidObjectId(id))
      : [];
    if (!ids.length) return res.status(400).json({ message: 'Selecciona al menos una notificación.' });
    const result = await Notification.deleteMany({
      _id: { $in: ids },
      userId: req.user._id
    });
    return res.json({ message: 'Notificaciones eliminadas.', deletedCount: result.deletedCount });
  } catch (e) {
    console.error('No se pudieron eliminar las notificaciones:', e);
    return res.status(500).json({ message: 'No se pudieron eliminar las notificaciones.' });
  }
});
'''

          if "app.delete('/api/notifications/:id'" not in text:
              text = text.replace(marker, route + "\n" + marker, 1)
              path.write_text(text, encoding='utf-8')

      - name: Validate backend syntax
        run: node --check backend/server.js

      - name: Commit backend patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-notification-delete.yml
          git add backend/server.js
          git diff --cached --check
          git commit -m "Añadir API para eliminar notificaciones"
          git push