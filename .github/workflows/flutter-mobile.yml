name: Build INKLU Flutter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-mobile.yml'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Generate Android platform
        working-directory: flutter_app
        run: flutter create --platforms=android .
      - name: Install INKLU branding and internet permission
        working-directory: flutter_app
        run: |
          mkdir -p assets android/app/src/main/res/drawable
          cp ../assets/logo.png assets/logo.png
          python3 -c "import base64;from pathlib import Path;p=Path('assets/logo.png');Path('assets/logo.b64').write_text(base64.b64encode(p.read_bytes()).decode())"
          cp assets/logo.png android/app/src/main/res/drawable/inklu_icon.png
          sed -i 's#@mipmap/ic_launcher_round#@drawable/inklu_icon#g; s#@mipmap/ic_launcher#@drawable/inklu_icon#g; s/android:label="inklu"/android:label="INKLU"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: |
          flutter analyze --no-pub 2>&1 | tee analyze.txt
      - name: Run widget tests
        working-directory: flutter_app
        run: flutter test --reporter expanded

      - name: Upload analyze report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-analyze
          path: flutter_app/analyze.txt
      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-Android
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS build
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Generate iOS platform
        working-directory: flutter_app
        run: flutter create --platforms=ios .
      - name: Prepare INKLU logo
        working-directory: flutter_app
        run: |
          mkdir -p assets
          cp ../assets/logo.png assets/logo.png
          python3 -c "import base64;from pathlib import Path;p=Path('assets/logo.png');Path('assets/logo.b64').write_text(base64.b64encode(p.read_bytes()).decode())"

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: |
          flutter analyze --no-pub 2>&1 | tee analyze.txt
      - name: Run widget tests
        working-directory: flutter_app
        run: flutter test --reporter expanded

      - name: Upload analyze report
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-analyze-iOS
          path: flutter_app/analyze.txt
      - name: Build iOS without signing
        working-directory: flutter_app
        run: flutter build ios --simulator --debug
      - name: Package iOS build
        run: ditto -c -k --sequesterRsrc --keepParent flutter_app/build/ios/iphonesimulator/Runner.app INKLU-iOS.zip
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-iOS
          path: INKLU-iOS.zip

# Trigger APK build
