name: Build INKLU Flutter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-mobile.yml'

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    if: ${{ !contains(github.event.head_commit.message, 'Integrar pantalla completa de eliminar cuenta') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate DeleteAccountPage safely
        shell: python
        run: |
          from pathlib import Path
          path = Path('flutter_app/lib/main.dart')
          text = path.read_text(encoding='utf-8')
          import_line = "import 'delete_account_page.dart';\n"
          if import_line not in text:
              anchor = "import 'notifications_page.dart';\n"
              if anchor not in text:
                  raise SystemExit('No se encontró el bloque de imports esperado.')
              text = text.replace(anchor, anchor + import_line, 1)
          start = text.find('Future<void> deleteAccountFlow(BuildContext context, String token) async {')
          end = text.find('\nclass DeleteAccountButton extends StatelessWidget {', start)
          if start < 0 or end < 0:
              raise SystemExit('No se encontró deleteAccountFlow/DeleteAccountButton.')
          new_function = '''Future<void> deleteAccountFlow(BuildContext context, String token) async {
            final deleted = await Navigator.push<bool>(
              context,
              MaterialPageRoute(
                builder: (_) => DeleteAccountPage(
                  token: token,
                  api: api,
                  onDeleted: () async {
                    await clearSavedSession();
                    sessionToken = null;
                    sessionUser = null;
                  },
                ),
              ),
            );
            if (deleted == true && context.mounted) {
              Navigator.of(context).pushAndRemoveUntil(
                MaterialPageRoute(builder: (_) => const Welcome()),
                (_) => false,
              );
            }
          }
          '''
          text = text[:start] + new_function + text[end + 1:]
          path.write_text(text, encoding='utf-8')
          if "title: const Text('Cerrar sesión')" not in text:
              raise SystemExit('Validación: no se encontró la confirmación simple de cerrar sesión.')
      - name: Commit integrated page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart
          if [ -f .github/workflows/patch-delete-account-page.yml ]; then git rm .github/workflows/patch-delete-account-page.yml; fi
          if git diff --cached --quiet; then
            echo "No hay cambios de integración."
          else
            git commit -m "Integrar pantalla completa de eliminar cuenta"
            git push
          fi
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Generate Android platform
        working-directory: flutter_app
        run: flutter create --platforms=android .
      - name: Install INKLU branding and internet permission
        working-directory: flutter_app
        run: |
          mkdir -p assets android/app/src/main/res/drawable
          cp ../assets/logo.png assets/logo.png
          python3 -c "import base64;from pathlib import Path;p=Path('assets/logo.png');Path('assets/logo.b64').write_text(base64.b64encode(p.read_bytes()).decode())"
          cp assets/logo.png android/app/src/main/res/drawable/inklu_icon.png
          sed -i 's#@mipmap/ic_launcher_round#@drawable/inklu_icon#g; s#@mipmap/ic_launcher#@drawable/inklu_icon#g; s/android:label=\"inklu\"/android:label=\"INKLU\"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.txt
      - name: Run widget tests
        working-directory: flutter_app
        run: flutter test --reporter expanded

      - name: Upload analyze report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-analyze
          path: flutter_app/analyze.txt
      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-Android
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS build
    if: ${{ !contains(github.event.head_commit.message, 'Integrar pantalla completa de eliminar cuenta') }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Generate iOS platform
        working-directory: flutter_app
        run: flutter create --platforms=ios .
      - name: Prepare INKLU logo
        working-directory: flutter_app
        run: |
          mkdir -p assets
          cp ../assets/logo.png assets/logo.png
          python3 -c "import base64;from pathlib import Path;p=Path('assets/logo.png');Path('assets/logo.b64').write_text(base64.b64encode(p.read_bytes()).decode())"

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.txt
      - name: Run widget tests
        working-directory: flutter_app
        run: flutter test --reporter expanded

      - name: Upload analyze report
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-analyze-iOS
          path: flutter_app/analyze.txt
      - name: Build iOS without signing
        working-directory: flutter_app
        run: flutter build ios --simulator --debug
      - name: Package iOS build
        run: ditto -c -k --sequesterRsrc --keepParent flutter_app/build/ios/iphonesimulator/Runner.app INKLU-iOS.zip
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: INKLU-iOS
          path: INKLU-iOS.zip

# Trigger APK build
