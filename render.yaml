services:
  - type: web
    name: inklu-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /health
    disk:
      name: inklu-cv-storage
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 3000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://inklu-api.onrender.com/api/auth/google/callback
      - key: MOBILE_AUTH_REDIRECT_URI
        value: inklu://auth/google
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PASSWORD_RESET_BASE_URL
        value: https://inklu-api.onrender.com/api/auth/reset-password
