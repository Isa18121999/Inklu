name: inklu

description: INKLU - empleo inclusivo para Android e iOS.
publish_to: 'none'
version: 1.1.1+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.1.7
  pdf: ^3.11.3
  printing: ^5.14.2
  firebase_core: ^4.15.2
  firebase_messaging: ^16.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

dependency_overrides:
  archive: 4.0.8
  image: 4.10.2
